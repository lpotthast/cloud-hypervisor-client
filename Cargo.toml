[package]
name = "cloud-hypervisor-client"
version = "0.4.0+api-spec-0.3.0-2026-05-04"
authors = ["Lukas Potthast <privat@lukas-potthast.de>"]
edition = "2024"
rust-version = "1.86.0"
license = "MIT OR Apache-2.0"
readme = "README.md"
description = "Unofficial Rust crate for accessing the cloud-hypervisor REST API."
repository = "https://github.com/lpotthast/cloud-hypervisor-client"
keywords = ["cloud-hypervisor", "hypervisor", "virtualization", "vmm", "REST-API"]
categories = ["api-bindings", "virtualization", "web-programming::http-client"]

[package.metadata.api-spec]
upstream-version = "0.3.0"
regenerated-at = "2026-05-04"

[dependencies]
futures = "^0.3"
http = "1"
http-body-util = { version = "0.1.2" }
hyper = { version = "^1.3.1", features = ["full"] }
hyper-util = { version = "0.1.5", features = ["client", "client-legacy", "http1", "http2"] }
hyperlocal = "0.9.1"
serde = { version = "1.0.207", features = ["derive"] }
serde_json = "1.0.124"
serde_repr = "0.1.19"
thiserror = "2.0.12"
url = "2.5.2"
uuid = { version = "1.10.0", features = ["serde", "v4"] }

[dev-dependencies]
tokio = { version = "1.39.2", features = ["macros", "rt-multi-thread"] }
